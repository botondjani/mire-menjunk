<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Statisztika – Hova menjünk?</title>
  <meta name="theme-color" content="#0e0e10">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: "Bricolage Grotesque"; font-weight: 700; font-display: swap; src: url("fonts/bricolage-700.woff2") format("woff2"); }
    @font-face { font-family: "Bricolage Grotesque"; font-weight: 800; font-display: swap; src: url("fonts/bricolage-800.woff2") format("woff2"); }
    @font-face { font-family: "Figtree"; font-weight: 400; font-display: swap; src: url("fonts/figtree-400.woff2") format("woff2"); }
    @font-face { font-family: "Figtree"; font-weight: 500; font-display: swap; src: url("fonts/figtree-500.woff2") format("woff2"); }
    @font-face { font-family: "Figtree"; font-weight: 600; font-display: swap; src: url("fonts/figtree-600.woff2") format("woff2"); }
    @font-face { font-family: "Figtree"; font-weight: 700; font-display: swap; src: url("fonts/figtree-700.woff2") format("woff2"); }
    :root {
      --bg: #0e0e10; --surface: #18181b; --surface-2: #222226; --ink: #f4f4f5; --muted: #a1a1aa; --line: #2b2b30;
      --bar: #ffd100; --bar-hover: #ffe55c; color-scheme: dark;
      --display: "Bricolage Grotesque", system-ui, sans-serif; --body: "Figtree", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f5f4f1; --surface: #fff; --surface-2: #ecebe7; --ink: #131315; --muted: #5f5e66; --line: #e2e0db; --bar: #3a3a40; --bar-hover: #131315; color-scheme: light; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); }
    main { max-width: 860px; margin: 0 auto; padding: 20px 16px 64px; }
    a { color: inherit; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    h1 { font: 800 1.9rem/1.1 var(--display); letter-spacing: -.03em; margin: 8px 0; }
    h2 { font: 700 1.05rem var(--display); margin: 0 0 12px; }
    .back { font-weight: 700; text-decoration: none; color: var(--muted); }
    .range { display: flex; gap: 6px; }
    .range button { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 600 .88rem var(--body); cursor: pointer; }
    .range button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 18px 0; }
    .tile { padding: 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
    .tile b { display: block; font: 800 1.7rem/1.1 var(--display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .tile span { color: var(--muted); font-size: .85rem; font-weight: 600; }
    .card { padding: 18px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); margin-top: 12px; }
    .chart { position: relative; }
    .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
    .chart .grid { stroke: var(--line); stroke-width: 1; }
    .chart .axis { fill: var(--muted); font: 500 11px var(--body); }
    .chart .bar { fill: var(--bar); }
    .chart g.col:hover .bar, .chart g.col:focus .bar { fill: var(--bar-hover); }
    .chart g.col { outline: none; }
    .tip { position: absolute; pointer-events: none; transform: translate(-50%, -100%); padding: 6px 10px; border-radius: 10px; background: var(--ink); color: var(--bg); font-size: .82rem; font-weight: 600; white-space: nowrap; opacity: 0; transition: opacity .1s; }
    .tip.show { opacity: 1; }
    .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
    ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
    li { display: flex; gap: 10px; align-items: baseline; font-size: .92rem; }
    li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li b { font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); }
    .empty { color: var(--muted); font-size: .9rem; }
    .state { text-align: center; padding: 64px 12px; color: var(--muted); }
    details { margin-top: 10px; font-size: .88rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  </style>
</head>
<body>
<main>
  <a class="back" href="./?v=profil">← Vissza az appba</a>
  <header>
    <h1>Statisztika</h1>
    <div class="range" role="group" aria-label="Időszak">
      <button data-days="7" aria-pressed="false">7 nap</button>
      <button data-days="30" aria-pressed="true">30 nap</button>
      <button data-days="90" aria-pressed="false">90 nap</button>
    </div>
  </header>
  <div id="out"><p class="state">Betöltés…</p></div>
</main>
<script type="module">
  import * as auth from './auth.js?v=19';
  const out = document.getElementById('out');
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const num = (n) => Number(n || 0).toLocaleString('hu-HU');
  let titles = new Map();
  let days = 30;

  fetch('data/events.json').then((r) => r.json()).then((d) => { titles = new Map(d.events.map((e) => [e.id, e.title])); }).catch(() => {});

  function list(rows, label = (r) => titles.get(r.event_id) || r.event_id) {
    if (!rows?.length) return '<p class="empty">Még nincs adat.</p>';
    return `<ol>${rows.map((r) => `<li><span title="${esc(label(r))}">${esc(label(r))}</span><b>${num(r.n)}</b></li>`).join('')}</ol>`;
  }

  /** Napi egyedi látogatók oszlopdiagramja; hiányzó napok nullával, rámutatásra pontos érték. */
  function chart(daily) {
    const map = new Map(daily.map((d) => [d.day, d]));
    const series = [];
    for (let i = days - 1; i >= 0; i--) {
      const day = new Date(Date.now() - i * 86400000).toLocaleDateString('sv-SE', { timeZone: 'Europe/Budapest' });
      series.push({ day, v: map.get(day)?.visitors ?? 0, views: map.get(day)?.views ?? 0 });
    }
    const max = Math.max(4, ...series.map((s) => s.v));
    const step = Math.pow(10, Math.floor(Math.log10(max)));
    const top = Math.ceil(max / step) * step;
    const W = Math.max(300, out.clientWidth - 38), H = 200, padL = 32, padB = 22, gap = 2;
    const bw = (W - padL) / series.length;
    const y = (v) => (H - padB) - (v / top) * (H - padB - 8);
    const ticks = [0, top / 2, top];
    const labelEvery = Math.ceil(series.length / 6);
    return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Napi egyedi látogatók az utolsó ${days} napban">
      ${ticks.map((t) => `<line class="grid" x1="${padL}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${padL - 6}" y="${y(t) + 4}" text-anchor="end">${num(t)}</text>`).join('')}
      ${series.map((s, i) => {
        const x = padL + i * bw + gap / 2, h = Math.max(0, y(0) - y(s.v)), w = Math.max(1, bw - gap);
        const r = Math.min(4, w / 2, h);
        const label = new Date(s.day).toLocaleDateString('hu-HU', { month: 'short', day: 'numeric' });
        return `<g class="col" tabindex="0" data-tip="${esc(`${label}: ${num(s.v)} látogató · ${num(s.views)} megtekintés`)}">
          <rect x="${padL + i * bw}" y="0" width="${bw}" height="${H - padB}" fill="transparent"/>
          ${h ? `<path class="bar" d="M${x},${y(0)} V${y(s.v) + r} Q${x},${y(s.v)} ${x + r},${y(s.v)} H${x + w - r} Q${x + w},${y(s.v)} ${x + w},${y(s.v) + r} V${y(0)} Z"/>` : ''}
          ${i % labelEvery === 0 ? `<text class="axis" x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${esc(label)}</text>` : ''}
        </g>`;
      }).join('')}
    </svg><div class="tip" role="status"></div></div>
    <details><summary>Táblázat</summary><table><tr><th>Nap</th><th>Látogató</th><th>Megtekintés</th></tr>
      ${series.filter((s) => s.v || s.views).reverse().map((s) => `<tr><td>${s.day}</td><td>${num(s.v)}</td><td>${num(s.views)}</td></tr>`).join('')}</table></details>`;
  }

  function wireTips() {
    const box = out.querySelector('.chart');
    if (!box) return;
    const tip = box.querySelector('.tip');
    const show = (g) => {
      const r = g.getBoundingClientRect(), b = box.getBoundingClientRect();
      tip.textContent = g.dataset.tip;
      tip.style.left = `${Math.min(Math.max(r.left - b.left + r.width / 2, 90), b.width - 90)}px`;
      tip.style.top = `${Math.max(0, (g.querySelector('.bar')?.getBoundingClientRect().top ?? r.bottom - 30) - b.top - 6)}px`;
      tip.classList.add('show');
    };
    box.querySelectorAll('.col').forEach((g) => {
      g.addEventListener('pointerenter', () => show(g));
      g.addEventListener('focus', () => show(g));
      g.addEventListener('pointerleave', () => tip.classList.remove('show'));
      g.addEventListener('blur', () => tip.classList.remove('show'));
    });
  }

  async function load() {
    try {
      const user = await auth.currentUser();
      if (!user) { out.innerHTML = '<p class="state">Ehhez be kell lépned az appban. <a href="./?v=profil">Belépés</a></p>'; return; }
      const c = await auth.client();
      const { data, error } = await c.rpc('analytics_summary', { p_days: days });
      if (error) { out.innerHTML = `<p class="state">${error.code === '42501' ? 'Ez az oldal csak a szerkesztőknek érhető el.' : 'Most nem sikerült betölteni.'}</p>`; return; }
      const t = data.totals || {};
      const today = data.daily?.find((d) => d.day === new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Budapest' }));
      const tiles = [
        [data.visitors, 'egyedi látogatás (napi szinten)'],
        [today?.visitors ?? 0, 'látogató ma'],
        [t.view, 'oldalmegtekintés'],
        [t.open, 'megnyitott program'],
        [t.save, 'mentés'],
        [t.share, 'megosztás / meghívó'],
        [data.responses, 'válasz a meghívókra'],
        [data.users, 'regisztrált felhasználó'],
        [data.push_users, 'értesítést kér'],
        [t.install, 'telepítés'],
      ];
      out.innerHTML = `
        <div class="tiles">${tiles.map(([v, l]) => `<div class="tile"><b>${num(v)}</b><span>${esc(l)}</span></div>`).join('')}</div>
        <section class="card"><h2>Napi látogatók</h2>${chart(data.daily || [])}</section>
        <div class="cols">
          <section class="card"><h2>Legtöbbet megnyitott</h2>${list(data.top_open)}</section>
          <section class="card"><h2>Legtöbbet mentett</h2>${list(data.top_save)}</section>
          <section class="card"><h2>Legtöbbet megosztott</h2>${list(data.top_share)}</section>
          <section class="card"><h2>Honnan jönnek</h2>${list(data.refs, (r) => r.ref)}</section>
          <section class="card"><h2>Nézetek</h2>${list(data.views, (r) => ({ home: 'Felfedezés', list: 'Lista', search: 'Keresés', saved: 'Mentett', profile: 'Profil' }[r.view] || r.view))}</section>
          <section class="card"><h2>Eszközök</h2><ol>
            <li><span>Mobilról</span><b>${data.mobile_share ?? 0}%</b></li>
            <li><span>Telepített appból</span><b>${data.standalone_share ?? 0}%</b></li>
            <li><span>Követett helyek</span><b>${num(data.follows)}</b></li>
            <li><span>Mentett programok (fiókokban)</span><b>${num(data.saved)}</b></li>
            <li><span>Létrehozott meghívók</span><b>${num(data.plans)}</b></li>
          </ol></section>
        </div>
        <p class="muted" style="font-size:.82rem;margin-top:18px">Sütimentes mérés: az eszközön semmit nem tárolunk, a napi egyedi látogatót egy naponta cserélődő, visszafejthetetlen azonosító adja.</p>`;
      wireTips();
    } catch {
      out.innerHTML = '<p class="state">Most nem sikerült betölteni. Próbáld újra.</p>';
    }
  }

  document.querySelector('.range').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-days]');
    if (!b) return;
    days = Number(b.dataset.days);
    document.querySelectorAll('.range button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    load();
  });
  load();
</script>
</body>
</html>
